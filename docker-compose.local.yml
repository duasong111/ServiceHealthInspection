# docker-compose.local.yml — 宿主机已经有 PG / Redis 时的 override 文件
#
# 作用:
#   - 把 web / celery_worker / celery_beat 的 DB_HOST、REDIS_HOST
#     重定向到 host.docker.internal(即宿主机回环)
#   - postgres / redis 服务因 profile=infra 默认未被启用,自动跳过
#
# 用法(macOS / Windows Docker Desktop):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Linux + 旧版 docker (没有 host.docker.internal) 改用:
#   LOCAL_DB_HOST=172.17.0.1 LOCAL_REDIS_HOST=172.17.0.1 \
#       docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# 本文件只覆盖环境变量;web/worker/beat 的镜像、端口、depends_on、extra_hosts
# 全部从 docker-compose.yml 继承。profiles 里的 postgres/redis 不受影响,
# default up 不会启它们。

x-common-env-local: &common-env-local
  DJANGO_SETTINGS_MODULE: ServiceHealthInspection.settings
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${LOCAL_DB_NAME:-postgres}                       # 宿主机 PG 的库名,默认 postgres
  DB_USER: ${LOCAL_DB_USER:-postgres}
  DB_PASSWORD: ${LOCAL_DB_PASSWORD:-gsm200818534}
  DB_HOST: ${LOCAL_DB_HOST:-host.docker.internal}           # ⭐ 指向宿主机回环
  DB_PORT: ${LOCAL_DB_PORT:-5432}
  TZ: Asia/Shanghai
  REDIS_HOST: ${LOCAL_REDIS_HOST:-host.docker.internal}     # ⭐ 指向宿主机回环
  REDIS_PORT: ${LOCAL_REDIS_PORT:-6379}
  REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-gsm200818534}
  REDIS_DB: ${LOCAL_REDIS_DB:-5}

services:
  web:
    environment:
      <<: *common-env-local
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY:?需要给 .env 设置 INSPECTOR_FIELD_ENCRYPTION_KEY}

  celery_worker:
    environment:
      <<: *common-env-local
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY:?需要给 .env 设置 INSPECTOR_FIELD_ENCRYPTION_KEY}

  celery_beat:
    environment:
      <<: *common-env-local
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY:?需要给 .env 设置 INSPECTOR_FIELD_ENCRYPTION_KEY}
