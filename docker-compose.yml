# docker-compose.yml — 本项目一键起 PostgreSQL + Redis + Web + Celery
#
# 共用环境变量抽到 x-common-env 锚,web / celery_worker / celery_beat 都引用
# 密钥建议通过 .env 文件或 Docker secrets 注入,这里只放占位。

x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: ServiceHealthInspection.settings
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: gsm200818534
  DB_HOST: postgres
  DB_PORT: "5432"
  TZ: Asia/Shanghai
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: gsm200818534
  REDIS_DB: "5"

services:
  postgres:
    image: postgres:15
    container_name: shi_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gsm200818534
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shi_redis
    command: ["redis-server", "--requirepass", "gsm200818534"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "gsm200818534", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shi_service:latest
    container_name: shi_web
    command:
      - "uvicorn"
      - "ServiceHealthInspection.asgi:application"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "2"
    volumes:
      # 只挂载代码(开发用 hot-reload);生产建议改 image tag,不挂载
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      # INSPECTOR_FIELD_ENCRYPTION_KEY 从同目录 .env 文件读,不要提交到 git
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    # 与 web 共用镜像,只覆盖 command
    image: shi_service:latest
    container_name: shi_celery_worker
    command:
      - "celery"
      - "-A"
      - "ServiceHealthInspection"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    volumes:
      - .:/app
    environment:
      <<: *common-env
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    # beat 与 worker 必须分开部署,否则 beat 的定时状态会被 worker 抢着 lock
    image: shi_service:latest
    container_name: shi_celery_beat
    command:
      - "celery"
      - "-A"
      - "ServiceHealthInspection"
      - "beat"
      - "--loglevel=info"
    volumes:
      - .:/app
    environment:
      <<: *common-env
      INSPECTOR_FIELD_ENCRYPTION_KEY: ${INSPECTOR_FIELD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
